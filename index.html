<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Серпухов: день с павлином</title>
<style>
:root{
  --ink:#0C1A1D; --deep:#12292D;
  --card:#F5EFE1; --card-2:#EDE4D0; --line:#D8CDB4;
  --crimson:#A3202B; --gold:#D6A43C; --teal:#1B7A73; --teal-dk:#0F5B57;
  --text:#18272A; --muted:#5E6D6E; --ok:#20705A; --no:#9A3B33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--card);
  font:400 17px/1.58 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}

header{position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--ink) 74%,rgba(12,26,29,0));padding:10px 16px 14px}
.hbar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hmeta{margin-left:auto;display:flex;gap:14px;align-items:baseline;font-size:14px;color:#9FB2B1}
.hmeta b{font:600 17px/1 system-ui,sans-serif;color:var(--gold)}
.hname{font:600 15px/1.2 Georgia,serif;color:#B9CBC9}

h1{font:700 33px/1.12 Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:18px 0 6px}
h2{font:700 24px/1.15 Georgia,serif;margin:0 0 4px;color:var(--text)}
h3{font:600 18px/1.3 Georgia,serif;margin:0 0 8px;color:var(--text)}
p{margin:0 0 13px}
.lede{color:#C2D2D0}
.sub{color:#8FA4A3;font:400 16px/1.4 Georgia,serif;font-style:italic;margin:0 0 16px}

.card{background:var(--card);color:var(--text);border-radius:14px;padding:20px;margin:0 0 16px;
  box-shadow:0 1px 0 rgba(0,0,0,.35)}
.card.dim{background:var(--card-2)}
.card p:last-child{margin-bottom:0}
.kicker{display:inline-block;font:600 13px/1 system-ui,sans-serif;color:var(--crimson);margin:0 0 10px}
.addr{font-size:15px;color:var(--muted);margin:0 0 14px;padding-left:14px;border-left:3px solid var(--gold)}
.addr a{color:var(--teal-dk);font-weight:600}
.story p{font-size:17.5px}
.story p+p{margin-top:0}
.legend{background:#EFE6D0;border-radius:10px;padding:14px 16px;margin:16px 0 0;font-size:16px}
.legend b{color:var(--crimson)}

/* счётчик павлинов */
.pav{background:#123033;border:1.5px solid #24484A;border-radius:12px;padding:12px 16px;margin:0 0 16px;
  display:flex;align-items:center;gap:12px}
.pav .lbl{font:600 15px/1.2 system-ui,sans-serif;color:#B9CBC9}
.pav .n{margin-left:auto;font:700 20px/1 Georgia,serif;color:var(--gold);min-width:52px;text-align:right}
.pav button{width:42px;height:42px;border-radius:10px;border:1.5px solid #2C5254;background:#0F262A;
  color:var(--gold);font:600 22px/1 system-ui,sans-serif;cursor:pointer}

.task{background:var(--card);color:var(--text);border-radius:14px;padding:18px 20px;margin:0 0 14px;border-left:5px solid var(--teal)}
.task.find{border-left-color:var(--gold)}
.task.duel{border-left-color:var(--crimson)}
.tlabel{font:600 13px/1 system-ui,sans-serif;color:var(--muted);margin:0 0 8px}
.q{font:600 18px/1.35 system-ui,sans-serif;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:9px}
button.opt{display:block;width:100%;text-align:left;font:400 16px/1.35 system-ui,sans-serif;color:var(--text);
  background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer}
button.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.opt.right{background:#E1F0E6;border-color:var(--ok);font-weight:600}
button.opt.wrong{background:#F6E2E0;border-color:var(--no)}
button.opt[disabled]{cursor:default;opacity:.92}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row button{flex:1 1 140px}
button.act{font:600 16px/1.2 system-ui,sans-serif;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:14px 16px;cursor:pointer}
button.act.ghost{background:transparent;color:var(--teal-dk);border:1.5px solid var(--teal)}
button.hintbtn{background:none;border:0;color:var(--teal-dk);font:600 15px/1 system-ui,sans-serif;padding:10px 0 0;cursor:pointer;text-decoration:underline}
.hint{margin:10px 0 0;font-size:15px;color:var(--muted);font-style:italic}
.verdict{margin:14px 0 0;padding:13px 15px;border-radius:10px;font-size:16px;background:#EFE6D0}
.verdict.good{background:#E1F0E6}
.verdict.bad{background:#F6E2E0}
.verdict b{display:block;margin-bottom:4px}

.nav{display:flex;gap:10px;margin:22px 0 0}
button.next{font:600 18px/1.2 system-ui,sans-serif;background:var(--gold);color:#2A1F06;border:0;border-radius:12px;padding:17px;width:100%;cursor:pointer;flex:1}
button.next[disabled]{background:#2A3C3E;color:#7E8E8F;cursor:default}
button.back{background:none;border:1.5px solid #33484A;color:#9FB2B1;border-radius:12px;padding:15px;font:500 15px/1 system-ui,sans-serif;cursor:pointer;flex:0 0 96px}
.small{font-size:14px;color:#8A9C9C;margin:16px 0 0;text-align:center}
.score{font:700 66px/1 Georgia,serif;color:var(--crimson);margin:0}
ul.recap{margin:0;padding-left:20px}
ul.recap li{margin:0 0 9px}
ul.list{margin:0;padding-left:19px;font-size:16px}
ul.list li{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============ СОСТОЯНИЕ ============ */
var S={i:-1,score:0,done:[],started:null,answers:{},pav:0};
(function(){var raw=load("serp_day");if(raw){try{var o=JSON.parse(raw);if(o&&typeof o.i==="number"){S=o;if(typeof S.pav!=="number")S.pav=0;}}catch(e){}}})();
function persist(){save("serp_day",JSON.stringify(S));}
var MAXPOINTS=(function(){var t=0;STATIONS.forEach(function(s){t+=s.tasks.length*10;});return t+BLITZ.length*10;})();

function drawTail(){
 var g=document.getElementById("feathers"),n=STATIONS.length,h="";
 for(var k=0;k<n;k++){
  var a=(-60+k*(120/(n-1)))*Math.PI/180,x=48+Math.sin(a)*34,y=40-Math.cos(a)*33,on=S.done.indexOf(k)>-1;
  h+='<line x1="48" y1="41" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+(on?"#1B7A73":"#2A3C3E")+'" stroke-width="1.5"/>';
  h+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="3.6" ry="4.8" fill="'+(on?"#1B7A73":"#20302F")+'" stroke="'+(on?"#D6A43C":"#2A3C3E")+'" stroke-width="1.3"/>';
  if(on)h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="1.5" fill="#A3202B"/>';
 }
 g.innerHTML=h;
}
function tick(){var el=document.getElementById("htime");if(!el)return;
 if(!S.started){el.textContent="0:00";return;}
 var m=Math.floor((Date.now()-S.started)/60000);
 el.textContent=Math.floor(m/60)+":"+("0"+(m%60)).slice(-2);}
setInterval(tick,20000);
function refreshHeader(){
 document.getElementById("hscore").textContent=S.score;
 document.getElementById("hname").textContent=S.i<0?"Серпухов":(S.i>=STATIONS.length?"Финал":"Точка "+(S.i+1)+" из "+STATIONS.length);
 drawTail();tick();
}

var app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){refreshHeader();persist();window.scrollTo(0,0);
 if(S.i<0)return renderIntro();
 if(S.i>=STATIONS.length)return renderFinal();
 renderStation(STATIONS[S.i],S.i);}

 '<div class="card dim"><h3>Сквозная охота</h3>'+
 '<p>По городу расставлены четырнадцать бронзовых павлинчиков, у каждого своя профессия. Считается, что нашедший всех может загадать желание. Отмечайте находки счётчиком — он будет внизу каждой страницы.</p>'+
 '<ul class="list">'+li+'</ul>'+
 '<p style="margin-top:13px;color:#5E6D6E;font-size:15px">Часть птиц со временем переезжала или пропадала, так что полный комплект — задача со звёздочкой.</p></div>'+
 '<div class="card dim"><h3>Перед выходом</h3>'+
 '<p>Удобная обувь обязательна: Соборная гора — настоящий подъём, а до монастырей идти прилично.</p>'+
 '<p>В обители лучше зайти с покрытой головой и в закрытой одежде, и проверьте часы работы — под вечер территорию закрывают.</p></div>'+
 '<button class="next" id="go">Начать день</button>'+
 (S.done.length?'<p class="small"><a href="#" id="reset" style="color:#8A9C9C">Сбросить прогресс</a></p>':'');
 document.getElementById("go").onclick=function(){if(!S.started)S.started=Date.now();S.i=0;render();};
 var r=document.getElementById("reset");
 if(r)r.onclick=function(e){e.preventDefault();S={i:-1,score:0,done:[],started:null,answers:{},pav:0};render();};
}

function pavBlock(){
 return '<div class="pav"><button id="pminus" aria-label="Убрать павлина">&minus;</button>'+
        '<button id="pplus" aria-label="Добавить павлина">+</button>'+
        '<span class="lbl">Найдено павлинчиков</span><span class="n" id="pn">'+S.pav+' / 14</span></div>';
}
function wirePav(){
 var p=document.getElementById("pplus"),m=document.getElementById("pminus");
 if(!p)return;
 p.onclick=function(){if(S.pav<14){S.pav++;document.getElementById("pn").textContent=S.pav+" / 14";persist();}};
 m.onclick=function(){if(S.pav>0){S.pav--;document.getElementById("pn").textContent=S.pav+" / 14";persist();}};
}

function renderStation(st,idx){
 var h='<h1>'+esc(st.name)+'</h1>'+
 '<div class="card"><div class="kicker">Как дойти</div>'+
 '<div class="addr">'+esc(st.addr)+'<br><a href="https://yandex.ru/maps/?text='+encodeURIComponent(st.map)+'" target="_blank" rel="noopener">Открыть в картах</a></div>'+
 '<p>'+esc(st.walk)+'</p></div>'+
 '<div class="card story"><div class="kicker">История этого места</div>';
 st.story.forEach(function(f){h+='<p>'+esc(f)+'</p>';});
 if(st.legend)h+='<div class="legend"><b>Кстати.</b> '+esc(st.legend)+'</div>';
 h+='</div>';
 if(st.note)h+='<div class="card dim"><p>'+esc(st.note)+'</p></div>';

 st.tasks.forEach(function(t,ti){
  var key=idx+"_"+ti;
  var cls=t.type==="quiz"?"task":(t.type==="find"?"task find":"task duel");
  var lab=t.type==="quiz"?"Вопрос":(t.type==="find"?"Найдите на месте":"Задание на двоих");
  h+='<div class="'+cls+'"><div class="tlabel">'+lab+'</div><div class="q">'+esc(t.q)+'</div><div id="b'+key+'"></div></div>';
 });
 h+=pavBlock()+'<div class="nav">'+(idx>0?'<button class="back" id="back">Назад</button>':'')+
    '<button class="next" id="next" disabled>Точка пройдена</button></div>'+
    '<p class="small">Ответьте на все задания, чтобы идти дальше</p>';
 app.innerHTML=h;
 st.tasks.forEach(function(t,ti){mountTask(t,idx,ti);});
 wirePav();
 var b=document.getElementById("back");
 if(b)b.onclick=function(){S.i--;render();};
 document.getElementById("next").onclick=function(){if(S.done.indexOf(idx)<0)S.done.push(idx);S.i++;render();};
 checkStationDone(idx);
}

function mountTask(t,idx,ti){
 var key=idx+"_"+ti,box=document.getElementById("b"+key),prev=S.answers[key];
 if(t.type==="quiz"){
  var h='<div class="opts">';
  t.opts.forEach(function(o,oi){h+='<button class="opt" data-o="'+oi+'">'+esc(o)+'</button>';});
  h+='</div><button class="hintbtn" id="h'+key+'">Нужна подсказка</button><div id="v'+key+'"></div>';
  box.innerHTML=h;
  var hintUsed=prev?!!prev.hint:false;
  document.getElementById("h"+key).onclick=function(){hintUsed=true;this.outerHTML='<p class="hint">'+esc(t.hint)+'</p>';};
  box.querySelectorAll("button.opt").forEach(function(btn){
   btn.onclick=function(){
    var oi=+btn.dataset.o,ok=(oi===t.right);
    lockOpts(box,t.right,oi);
    var hb=document.getElementById("h"+key); if(hb)hb.remove();
    var pts=ok?(hintUsed?5:10):0;
    if(!S.answers[key]){S.score+=pts;S.answers[key]={ok:ok,hint:hintUsed,pts:pts};}
    document.getElementById("v"+key).innerHTML='<div class="verdict '+(ok?"good":"bad")+'"><b>'+(ok?"Верно. +"+pts+" очк.":"Мимо. Верный ответ подсвечен.")+'</b>'+esc(t.why)+'</div>';
    refreshHeader();persist();checkStationDone(idx);
   };
  });
  if(prev){
   lockOpts(box,t.right,prev.ok?t.right:-1);
   var hb0=document.getElementById("h"+key);if(hb0)hb0.remove();
   document.getElementById("v"+key).innerHTML='<div class="verdict '+(prev.ok?"good":"bad")+'"><b>'+(prev.ok?"Верно. +"+prev.pts+" очк.":"Было неверно.")+'</b>'+esc(t.why)+'</div>';
  }
 }
 if(t.type==="find"){
  box.innerHTML='<div class="row"><button class="act" data-f="1">Нашли</button><button class="act ghost" data-f="0">Не нашли</button></div>'+
   (t.hint?'<button class="hintbtn" id="h'+key+'">Нужна подсказка</button>':'')+'<div id="v'+key+'"></div>';
  var hb2=document.getElementById("h"+key);
  if(hb2)hb2.onclick=function(){this.outerHTML='<p class="hint">'+esc(t.hint)+'</p>';};
  box.querySelectorAll("button.act").forEach(function(btn){
   btn.onclick=function(){
    var found=btn.dataset.f==="1",pts=found?10:3;
    box.querySelectorAll("button.act").forEach(function(b){b.disabled=true;b.style.opacity=.5;});
    btn.style.opacity=1;
    if(!S.answers[key]){S.score+=pts;S.answers[key]={ok:found,pts:pts};}
    document.getElementById("v"+key).innerHTML='<div class="verdict '+(found?"good":"")+'"><b>'+(found?"Засчитано. +10 очк.":"Бывает. +3 очк.")+'</b>'+esc(t.reveal)+'</div>';
    refreshHeader();persist();checkStationDone(idx);
   };
  });
  if(prev){
   box.querySelectorAll("button.act").forEach(function(b){b.disabled=true;b.style.opacity=.5;});
   document.getElementById("v"+key).innerHTML='<div class="verdict '+(prev.ok?"good":"")+'"><b>'+(prev.ok?"Засчитано. +10 очк.":"Отмечено. +3 очк.")+'</b>'+esc(t.reveal)+'</div>';
  }
 }
 if(t.type==="duel"){
  box.innerHTML='<div class="row"><button class="act" id="d'+key+'">Мы поспорили и проверили</button></div><div id="v'+key+'"></div>';
  document.getElementById("d"+key).onclick=function(){
   this.disabled=true;this.style.opacity=.5;
   if(!S.answers[key]){S.score+=10;S.answers[key]={ok:true,pts:10};}
   document.getElementById("v"+key).innerHTML='<div class="verdict good"><b>+10 очк. на двоих.</b>'+esc(t.reveal)+'</div>';
   refreshHeader();persist();checkStationDone(idx);
  };
  if(prev){var db=document.getElementById("d"+key);db.disabled=true;db.style.opacity=.5;
   document.getElementById("v"+key).innerHTML='<div class="verdict good"><b>+10 очк. на двоих.</b>'+esc(t.reveal)+'</div>';}
 }
}
function lockOpts(box,right,picked){
 box.querySelectorAll("button.opt").forEach(function(b){
  var oi=+b.dataset.o;b.disabled=true;
  if(oi===right)b.classList.add("right");else if(oi===picked)b.classList.add("wrong");
 });
}
function checkStationDone(idx){
 var st=STATIONS[idx],all=true;
 for(var ti=0;ti<st.tasks.length;ti++){if(!S.answers[idx+"_"+ti])all=false;}
 var btn=document.getElementById("next");
 if(btn){btn.disabled=!all;
  btn.textContent=all?(idx===STATIONS.length-1?"К финалу":"Дальше, к точке "+(idx+2)):"Точка пройдена";}
}

 BLITZ.forEach(function(b,bi){

   btn.onclick=function(){

   document.getElementById("v"+key).innerHTML='<div class="verdict '+(prev.ok?"good":"bad")+'"><b>'+(prev.ok?"Верно.":"Было неверно.")+'</b>'+esc(b.why)+'</div>';}
 });
 maybeResult();
}
function maybeResult(){
 if(!BLITZ.every(function(_,bi){return S.answers["B"+bi];}))return;
 var pct=Math.round(S.score/MAXPOINTS*100);
 var rank=pct<45?"Гость Серпухова":pct<70?"Знаток посада":pct<90?"Хранитель Соборной горы":"Павлин на гербе";
 var mins=S.started?Math.round((Date.now()-S.started)/60000):null;
 var wish=S.pav>=14?"Четырнадцать из четырнадцати. По местному поверью, теперь можно загадывать желание — вы его заслужили.":
   "Найдено павлинчиков: "+S.pav+" из 14. Полный комплект оставьте на следующий приезд, это честный повод вернуться.";
 document.getElementById("result").innerHTML=
 '<div class="card" style="text-align:center"><p class="kicker">Итог дня</p>'+
 '<p class="score">'+S.score+'</p>'+
